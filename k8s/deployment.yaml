apiVersion: apps/v1
kind: Deployment
metadata:
  name: canyon-backpack-sync
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/jacksondprice/canyon-backpack-sync:1.4.0
          envFrom:
            - secretRef:
                name: app-secrets
